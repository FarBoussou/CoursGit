<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Déroulant Simple</title>
    <style>
        /* Style général de la page */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        /* Style du conteneur du menu */
        .dropdown {
            position: relative;
            display: inline-block;
        }

        /* Style du bouton du menu */
        .dropbtn {
            background-color: #4CAF50;
            color: white;
            padding: 14px 20px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }

        /* Changer la couleur du bouton au survol */
        .dropbtn:hover {
            background-color: #45a049;
        }

        /* Style du contenu du menu déroulant (caché par défaut) */
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
            z-index: 1;
            border-radius: 4px;
        }

        /* Style des liens dans le menu déroulant */
        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        /* Changer la couleur des liens au survol */
        .dropdown-content a:hover {
            background-color: #ddd;
        }

        /* Afficher le menu au survol du bouton */
        .dropdown:hover .dropdown-content {
            display: block;
        }
    </style>
</head>
<body>

    <h2>Menu Déroulant Simple</h2>

    <!-- Menu déroulant -->
    <div class="dropdown">
        <button class="dropbtn">Menu</button>
        <div class="dropdown-content">
            <a href="#">Accueil</a>
            <a href="#">Services</a>
            <a href="#">À propos</a>
            <a href="#">Contact</a>
        </div>
    </div>

</body>
</html>
