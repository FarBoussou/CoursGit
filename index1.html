<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire d'inscription</title>
    <script>
        // Script pour vérifier que les mots de passe correspondent
        function validateForm() {
            var motdepasse = document.getElementById("motdepasse").value;
            var confirmMotdepasse = document.getElementById("confirm_motdepasse").value;
            
            if (motdepasse !== confirmMotdepasse) {
                alert("Les mots de passe ne correspondent pas !");
                return false;  // Empêche l'envoi du formulaire
            }
            return true;  // Si tout va bien, soumettre le formulaire
        }
    </script>
</head>
<body>
    <h2>Formulaire d'inscription</h2>

    <form action="/submit" method="POST" onsubmit="return validateForm()">
        <!-- Nom -->
        <label for="nom">Nom :</label>
        <input type="text" id="nom" name="nom" required>
        <br><br>

        <!-- Prénom -->
        <label for="prenom">Prénom :</label>
        <input type="text" id="prenom" name="prenom" required>
        <br><br>

        <!-- Email -->
        <label for="email">Email :</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <!-- Mot de passe -->
        <label for="motdepasse">Mot de passe :</label>
        <input type="password" id="motdepasse" name="motdepasse" required>
        <br><br>

        <!-- Confirmer le mot de passe -->
        <label for="confirm_motdepasse">Confirmer le mot de passe :</label>
        <input type="password" id="confirm_motdepasse" name="confirm_motdepasse" required>
        <br><br>

        <!-- Choisir la langue -->
        <label for="langue">Langue préférée :</label>
        <select id="langue" name="langue">
            <option value="fr">Français</option>
            <option value="en">Anglais</option>
            <option value="es">Espagnol</option>
        </select>
        <br><br>

        <!-- Accepter les conditions -->
        <label>
            <input type="checkbox" name="conditions" required> J'accepte les conditions d'utilisation.
        </label>
        <br><br>

        <!-- Bouton de soumission -->
        <button type="submit">S'inscrire</button>
    </form>

</body>
</html>
